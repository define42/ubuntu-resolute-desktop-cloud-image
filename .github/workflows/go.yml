name: Go

on:
  push:
    branches: [ "main" ]
    tags-ignore:
      - "v*"          # prevent infinite loops when pushing tags
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-26.04

    permissions:
      contents: write   # required for tags + GitHub releases
      packages: write   # required for GHCR push

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED for tag calculation

      - name: Install packages
        run: |
          ls -la
          sudo apt update -y
          sudo apt install wget -y

      - name: Download Ubuntu Resolute
        run: |
          wget https://cloud-images.ubuntu.com/resolute/current/resolute-server-cloudimg-amd64.img

      - name: Build cloud image with prebuilt virt tools
        run: |
          docker_args=(
            --rm
            --pull=always
            --volume "$GITHUB_WORKSPACE:/workspace"
            --workdir /workspace
          )

          if [[ -e /dev/kvm ]]; then
            docker_args+=(--device /dev/kvm)
          fi
          docker run "${docker_args[@]}" \
            ghcr.io/define42/virt-tools-container:latest \
            bash -euxo pipefail -c '
              rpm -q libguestfs guestfs-tools
              qemu-img create -f qcow2 resolute-build.img 8G
              virt-resize --expand /dev/sda1 \
                resolute-server-cloudimg-amd64.img \
                resolute-build.img
              virt-customize \
                -a resolute-build.img \
                --commands-from-file run-command.virt
              virt-sparsify --in-place resolute-build.img
              qemu-img convert -c -O qcow2 \
                resolute-build.img \
                resolute-desktop-xfce-cloudimg-amd64.img
            '
          ls -la

      # -------------------------------
      # Versioning & Release (main only)
      # -------------------------------
      - name: Bump version and create tag
        if: github.event_name == 'push'
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main

      - name: Stamp release image filename
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: |
          mv resolute-desktop-xfce-cloudimg-amd64.img resolute-desktop-xfce-cloudimg-amd64-${{ steps.tag.outputs.new_tag }}.img
          ls -la

      - name: Split release image
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        run: |
          image="resolute-desktop-xfce-cloudimg-amd64-${{ steps.tag.outputs.new_tag }}.img"
          sha256sum "$image" > "$image.sha256"
          split --bytes=1900M --numeric-suffixes=1 --suffix-length=2 \
            "$image" "$image.part-"
          rm -- "$image"
          ls -lh "$image".part-* "$image.sha256"

      - name: Create GitHub release
        if: github.event_name == 'push' && steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: Release ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          artifacts: "resolute-desktop-xfce-cloudimg-amd64-${{ steps.tag.outputs.new_tag }}.img.part-*,resolute-desktop-xfce-cloudimg-amd64-${{ steps.tag.outputs.new_tag }}.img.sha256"
          artifactErrorsFailBuild: true
